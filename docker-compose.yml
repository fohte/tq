# DB 専用 Compose ファイル
# 全 worktree で共有する。1 回だけ起動すればよい:
#   mise run db:up
name: tq-infra

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tq}
      POSTGRES_DB: ${POSTGRES_DB:-tq_dev}
    ports:
      - '127.0.0.1::5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tq}']
      interval: 5s
      timeout: 5s
      retries: 5
      # postgres is usually ready within a couple seconds; without this,
      # `docker compose up --wait` (used by both local dev and CI) would be
      # bound by the 5s interval above instead of actual startup time.
      start_period: 10s
      start_interval: 1s
    networks:
      - tq-net

volumes:
  db_data:

networks:
  tq-net:
    name: tq-net
