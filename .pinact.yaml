# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3

min_age:
  value: 7
  always: true

rules:
  # Owned actions/workflows; min-age policy targets third-party supply chain risk.
  - conditions:
      - expr: ActionRepoFullName in ["fohte/copier-update-action", "fohte/storybook-vrt-workflows"]
    min_age: 0
