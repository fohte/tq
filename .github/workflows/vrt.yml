name: VRT

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  # vitest's shard sequencer sorts specs by sha1(file path) and slices ranges
  # off that order — it never looks at which `--project` a spec belongs to.
  # Running both `storybook` and `storybook-mobile` in one `vitest` invocation
  # means every story file produces two specs with the *same* path and thus
  # the same hash, so ties between them settle in collection order, which
  # isn't stable across shards. A tied pair straddling a shard boundary gets
  # duplicated into one shard and dropped from another. One project per job
  # keeps every hash in a run unique, so the sort — and the shard split — is
  # deterministic. `matrix.shard`'s length must be kept in sync with the
  # `shards` input passed to vrt-capture below.
  shard:
    strategy:
      fail-fast: false
      matrix:
        project: [storybook, storybook-mobile]
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      - uses: fohte/storybook-vrt-workflows/vrt-capture@d466efc41e02b5ab567585915565d27b042d871b # v0.1.3
        with:
          project: ${{ matrix.project }}
          shard: ${{ matrix.shard }}
          shards: 2
          package-dir: web
          capture-script: test:storybook:capture

  # reg-suit treats anything present in `expected` but missing from `actual`
  # as deleted, so this job — and everything it does to the baseline — must
  # only run once every shard above has succeeded. `needs: shard` without an
  # explicit `if:` already skips this job when any shard fails; a partial
  # screenshot set must never reach `reg-suit compare`, let alone get
  # written into the shared baseline.
  report:
    needs: shard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # Overlapping runs for the same ref would otherwise race to publish to
    # the same R2 key at once — most importantly two main pushes racing to
    # update the single `baseline/actual/` key, where each run's diff was
    # computed against a baseline the other run is concurrently mutating.
    concurrency:
      group: vrt-report-${{ (github.ref == 'refs/heads/main') && 'push' || 'pr' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      - uses: fohte/storybook-vrt-workflows/vrt-report@d466efc41e02b5ab567585915565d27b042d871b # v0.1.3
        with:
          package-dir: web
          r2-bucket: tq-vrt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
