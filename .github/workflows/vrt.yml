name: VRT

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  # `--shard` splits both the `storybook` and `storybook-mobile` projects in
  # one pass since vitest shards across all `--project` specs together.
  # Bump/shrink the `matrix.shard` list to change the shard count —
  # `strategy.job-total` follows its length automatically.
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      # Storybook stories run through a headless Playwright chromium browser,
      # which isn't preinstalled on the runner. ubuntu-latest ships the
      # shared libraries chromium needs to launch, but not the CJK font
      # packages `--with-deps` pulls in — without them, Japanese text renders
      # as tofu boxes and every story with Japanese text shows up as a VRT
      # diff. A cache hit (browser binary only) still needs this.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      - name: Run Storybook screenshots
        working-directory: web
        run: |
          pnpm exec vitest run \
            --project=storybook --project=storybook-mobile \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-screenshots-${{ matrix.shard }}
          path: web/__screenshots__
          retention-days: 1

  # reg-suit treats anything present in `expected` but missing from `actual`
  # as deleted, so this job — and everything it does to the baseline — must
  # only run once every shard above has succeeded. `needs: shard` without an
  # explicit `if:` already skips this job when any shard fails; a partial
  # screenshot set must never reach `reg-suit compare`, let alone get
  # promoted to the live baseline.
  report:
    needs: shard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Overlapping runs for the same ref would otherwise let two VRT runs
    # publish snapshots to the same S3 key at once — most importantly two
    # main pushes racing to fill the same (non-live) baseline slot, which
    # could flip the pointer to a slot holding a mix of two runs' screenshots.
    concurrency:
      group: vrt-report-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      - name: Download screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vrt-screenshots-*
          path: web/__screenshots__
          merge-multiple: true

      # baseline/pointer names which of two slots (blue/green) is the live
      # baseline PRs compare against. main publishes into the other slot and
      # flips the pointer only after a successful run, so a failed reg-suit
      # or flip never corrupts the baseline every PR relies on, and promoting
      # is a single small object write instead of copying every screenshot.
      # A missing pointer falls back to the legacy main/latest key — but any
      # other read failure (auth, network, permissions) must not be treated
      # the same way, or a transient error could make main overwrite the
      # live slot instead of the intended target.
      - name: Set VRT snapshot keys
        id: vrt-keys
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          pointer_err=$(mktemp)
          if live_slot=$(aws s3 cp "s3://tq-vrt/baseline/pointer" - --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com 2>"$pointer_err"); then
            :
          elif grep -qE 'NoSuchKey|HeadObject operation: Not Found' "$pointer_err"; then
            live_slot=""
          else
            cat "$pointer_err" >&2
            exit 1
          fi

          if [ -n "$live_slot" ]; then
            echo "expected_key=baseline/$live_slot" >> "$GITHUB_OUTPUT"
          else
            echo "expected_key=main/latest" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ "$live_slot" = "blue" ]; then
              target_slot=green
            else
              target_slot=blue
            fi
            echo "actual_key=baseline/$target_slot" >> "$GITHUB_OUTPUT"
            echo "target_slot=$target_slot" >> "$GITHUB_OUTPUT"
          else
            # One key per branch: re-pushing to the same branch overwrites its
            # previous snapshot instead of accumulating a new one per commit.
            echo "actual_key=branch/${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # reg-suit's S3 publisher only uploads — it never deletes. Since a
      # baseline slot is reused across main pushes, a screenshot removed
      # since this slot was last written (e.g. a deleted story) would
      # otherwise linger and get reported as a false "deleted" diff every
      # time this slot becomes live again.
      - name: Clear VRT baseline target slot
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 rm "s3://tq-vrt/${{ steps.vrt-keys.outputs.actual_key }}/actual" \
            --recursive \
            --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com

      - name: Compare VRT screenshots
        working-directory: web
        id: vrt-compare
        env:
          VRT_ACTUAL_KEY: ${{ steps.vrt-keys.outputs.actual_key }}
          VRT_EXPECTED_KEY: ${{ steps.vrt-keys.outputs.expected_key }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pnpm exec reg-suit sync-expected
          pnpm exec reg-suit compare

          # expected/ is byte-for-byte identical to the baseline key's actual/
          # (that's literally where sync-expected fetched it from), so point the
          # report's "before" pane at the baseline directly instead of uploading
          # a duplicate copy under this run's key.
          expected_rel=$(node -e "console.log(require('path').posix.relative(process.env.VRT_ACTUAL_KEY, process.env.VRT_EXPECTED_KEY))")
          sed -i "s#\"expectedDir\":\"expected\"#\"expectedDir\":\"${expected_rel}/actual\"#" .reg/index.html

          diff_count=$(jq '(.failedItems | length) + (.newItems | length) + (.deletedItems | length)' .reg/out.json)
          echo "Diff count: $diff_count"
          if [ "$diff_count" -eq 0 ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish VRT report
        working-directory: web
        env:
          VRT_ACTUAL_KEY: ${{ steps.vrt-keys.outputs.actual_key }}
          VRT_EXPECTED_KEY: ${{ steps.vrt-keys.outputs.expected_key }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # A no-diff run still publishes out.json (`*.json` always matches
          # it) so vrt-comment-on-pr-open.yml has a fresh result to read;
          # the larger html/js/wasm report and image assets are skipped
          # since there's nothing to show.
          # `-n` still runs the notifier, which posts the "no visual
          # difference" PR comment either way.
          VRT_PUBLISH_PATTERN: ${{ steps.vrt-compare.outputs.has_diff == 'true' && '{*.{html,js,wasm,json},{actual,diff}/**/*.{png,jpeg,jpg,tiff,bmp,gif}}' || '*.json' }}
        run: pnpm exec reg-suit publish -n

      # Runs regardless of whether an open PR exists yet: pushing straight to
      # main (no PR) or to a branch without an open PR both no-op inside the
      # action instead of failing here.
      - name: Post VRT PR comment
        uses: ./.github/actions/vrt-comment
        with:
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          out-json-path: web/.reg/out.json
          report-url: https://tq-vrt.fohte.net/${{ steps.vrt-keys.outputs.actual_key }}/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # branch/<ref_name> is overwritten by every push to that branch (see
      # Set VRT snapshot keys above), so a consumer reading it later has no
      # way to tell which commit it reflects. This marker lets
      # vrt-comment-on-pr-open.yml confirm the branch key still matches the
      # PR's head commit before trusting it. Safe to publish unconditionally:
      # out.json is republished on every run too (VRT_PUBLISH_PATTERN above
      # always matches it), so the marker never outlives the result it
      # points at. Runs after the PR comment step (not before) and
      # tolerates its own failure so a transient marker-write error can never
      # skip the comment or fail the job.
      - name: Publish VRT commit marker
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo -n "${{ github.sha }}" | aws s3 cp - "s3://tq-vrt/${{ steps.vrt-keys.outputs.actual_key }}/sha" \
            --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com

      # Reached only once reg-suit has successfully published the new baseline
      # candidate to the non-live slot, so a failure above never touches the
      # pointer PRs actually read. Requires has_diff == 'true': a zero-diff run
      # skips the actual/ upload (see the Publish step above), so the target
      # slot's actual/ would still be empty from the Clear step — flipping to
      # it would break every PR's comparison instead of leaving the
      # still-accurate live slot in place.
      - name: Flip VRT baseline pointer
        if: github.ref == 'refs/heads/main' && steps.vrt-compare.outputs.has_diff == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo -n "${{ steps.vrt-keys.outputs.target_slot }}" | aws s3 cp - s3://tq-vrt/baseline/pointer \
            --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com
