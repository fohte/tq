name: VRT

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  # vitest's shard sequencer sorts specs by sha1(file path) and slices ranges
  # off that order — it never looks at which `--project` a spec belongs to.
  # Running both `storybook` and `storybook-mobile` in one `vitest` invocation
  # means every story file produces two specs with the *same* path and thus
  # the same hash, so ties between them settle in collection order, which
  # isn't stable across shards. A tied pair straddling a shard boundary gets
  # duplicated into one shard and dropped from another. One project per job
  # keeps every hash in a run unique, so the sort — and the shard split — is
  # deterministic. `matrix.shard`'s length is the shard count per project;
  # keep it in sync with the `/N` in the run step below.
  shard:
    strategy:
      fail-fast: false
      matrix:
        project: [storybook, storybook-mobile]
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      # Storybook stories run through a headless Playwright chromium browser,
      # which isn't preinstalled on the runner. ubuntu-latest ships the
      # shared libraries chromium needs to launch, but not the CJK font
      # packages `--with-deps` pulls in — without them, Japanese text renders
      # as tofu boxes and every story with Japanese text shows up as a VRT
      # diff. A cache hit (browser binary only) still needs this.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      - name: Run Storybook screenshots
        working-directory: web
        run: |
          pnpm exec vitest run \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shard }}/2

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # A screenshot with zero standard deviation is a single solid color —
      # nothing rendered. If a component crashes and leaves the page blank,
      # a blank baseline and a blank actual screenshot are pixel-identical,
      # so reg-suit reports no diff and the regression goes undetected.
      # Catching it here, before the baseline can absorb it, keeps a blank
      # screenshot from ever reaching the shared baseline.
      - name: Check for blank screenshots
        working-directory: web
        run: |
          blank=$(find __screenshots__ -name '*.png' -print0 \
            | xargs -0 -r identify -format "%[standard-deviation] %i\n" \
            | awk '$1 == 0')

          if [ -n "$blank" ]; then
            echo "Blank screenshot(s) detected (nothing rendered):"
            echo "$blank"
            exit 1
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-screenshots-${{ matrix.project }}-${{ matrix.shard }}
          path: web/__screenshots__
          retention-days: 1

  # reg-suit treats anything present in `expected` but missing from `actual`
  # as deleted, so this job — and everything it does to the baseline — must
  # only run once every shard above has succeeded. `needs: shard` without an
  # explicit `if:` already skips this job when any shard fails; a partial
  # screenshot set must never reach `reg-suit compare`, let alone get
  # written into the shared baseline.
  report:
    needs: shard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # Overlapping runs for the same ref would otherwise race to publish to
    # the same S3 key at once — most importantly two main pushes racing to
    # update the single `baseline/actual/` key, where each run's diff was
    # computed against a baseline the other run is concurrently mutating.
    concurrency:
      group: vrt-report-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      - name: Download screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vrt-screenshots-*
          path: web/__screenshots__
          merge-multiple: true

      # expected_key is the single baseline every branch compares against;
      # actual_key is this run's own report location.
      - name: Set VRT snapshot keys
        id: vrt-keys
        run: |
          echo "expected_key=baseline" >> "$GITHUB_OUTPUT"
          # One key per branch: re-pushing to the same branch overwrites its
          # previous snapshot instead of accumulating a new one per commit.
          echo "actual_key=branch/${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Compare VRT screenshots
        working-directory: web
        id: vrt-compare
        env:
          VRT_ACTUAL_KEY: ${{ steps.vrt-keys.outputs.actual_key }}
          VRT_EXPECTED_KEY: ${{ steps.vrt-keys.outputs.expected_key }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pnpm exec reg-suit sync-expected
          pnpm exec reg-suit compare

          # expected/ is byte-for-byte identical to the baseline key's actual/
          # (that's literally where sync-expected fetched it from), so point the
          # report's "before" pane at the baseline directly instead of uploading
          # a duplicate copy under this run's key.
          expected_rel=$(node -e "console.log(require('path').posix.relative(process.env.VRT_ACTUAL_KEY, process.env.VRT_EXPECTED_KEY))")
          sed -i "s#\"expectedDir\":\"expected\"#\"expectedDir\":\"${expected_rel}/actual\"#" .reg/index.html

          diff_count=$(jq '(.failedItems | length) + (.newItems | length) + (.deletedItems | length)' .reg/out.json)
          echo "Diff count: $diff_count"
          if [ "$diff_count" -eq 0 ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      # A passed item's actual/ file is byte-identical to baseline/actual/
      # (that's what made it pass), so uploading it again is a full copy of
      # the baseline for zero information. Deleting it here before publish
      # also drops it from index.html's embedded report data; out.json is
      # left untouched, since that's what the PR comment's passing count
      # reads from.
      - name: Strip passed items from VRT report
        working-directory: web
        run: |
          jq -r '.passedItems[]' .reg/out.json | while IFS= read -r item; do
            rm -f -- ".reg/actual/$item"
          done

          node <<'EOF'
          const fs = require("fs");
          const html = fs.readFileSync(".reg/index.html", "utf8");
          const prefix = "window['__reg__'] = ";
          const start = html.indexOf(prefix) + prefix.length;
          const end = html.indexOf(";</script>", start);
          const report = JSON.parse(html.slice(start, end));
          report.hasPassed = false;
          report.passedItems = [];
          fs.writeFileSync(
            ".reg/index.html",
            html.slice(0, start) + JSON.stringify(report) + html.slice(end),
          );
          EOF

      - name: Publish VRT report
        working-directory: web
        env:
          VRT_ACTUAL_KEY: ${{ steps.vrt-keys.outputs.actual_key }}
          VRT_EXPECTED_KEY: ${{ steps.vrt-keys.outputs.expected_key }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # actual/ now only holds failed+new items (see the previous step)
          # and diff/ only holds failed items' diffs, so this pattern uploads
          # nothing beyond the report shell when there's no diff — no need to
          # branch on has_diff.
          VRT_PUBLISH_PATTERN: '{*.{html,js,wasm,json},{actual,diff}/**/*.{png,jpeg,jpg,tiff,bmp,gif}}'
        run: pnpm exec reg-suit publish -n

      # Runs regardless of whether an open PR exists yet: pushing straight to
      # main (no PR) or to a branch without an open PR both no-op inside the
      # action instead of failing here.
      - name: Post VRT PR comment
        uses: ./.github/actions/vrt-comment
        with:
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          out-json-path: web/.reg/out.json
          report-url: https://tq-vrt.fohte.net/${{ steps.vrt-keys.outputs.actual_key }}/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A run that would report `failure` here must not clobber an approval
      # applied to this same commit while this job was still in flight —
      # that would silently negate a human's explicit "this diff is
      # intentional" call with the very run that prompted it. A `success`
      # result never needs this check: overwriting an existing approval with
      # `success` is a no-op either way.
      - name: Check for an existing VRT approval
        if: github.ref != 'refs/heads/main' && steps.vrt-compare.outputs.has_diff == 'true'
        id: vrt-approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          approved=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json labels \
            --jq 'if length == 0 then false else (.[0].labels | any(.name == "vrt-approved")) end')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

      # A separate, non-required status (as opposed to the required `unit-test`
      # gate) so a diff never blocks a merge by itself. vrt-approval.yml
      # overrides this to success when the `vrt-approved` label is applied,
      # and clears that label (never this status directly) on the next push
      # — the new commit's own status here starts fresh anyway.
      #
      # Skipped on main: a diff there just means a merged PR intentionally
      # changed the UI, already reviewed and approved on that PR. There's no
      # open PR to carry a `vrt-approved` label on main, so this status could
      # never be un-failed — it would sit red on main's HEAD permanently.
      #
      # continue-on-error so a transient failure here (rate limit, network
      # blip) can't skip the baseline update further down, the same
      # reasoning the "Publish VRT commit marker" step below already applies.
      - name: Set VRT commit status
        if: github.ref != 'refs/heads/main' && steps.vrt-approval.outputs.approved != 'true'
        continue-on-error: true
        uses: ./.github/actions/vrt-status
        with:
          repo: ${{ github.repository }}
          sha: ${{ github.sha }}
          state: ${{ steps.vrt-compare.outputs.has_diff == 'true' && 'failure' || 'success' }}
          description: ${{ steps.vrt-compare.outputs.has_diff == 'true' && 'Visual differences detected' || 'No visual differences' }}
          target-url: https://tq-vrt.fohte.net/${{ steps.vrt-keys.outputs.actual_key }}/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # branch/<ref_name> is overwritten by every push to that branch (see
      # Set VRT snapshot keys above), so a consumer reading it later has no
      # way to tell which commit it reflects. This marker lets
      # vrt-comment-on-pr-open.yml confirm the branch key still matches the
      # PR's head commit before trusting it. Safe to publish unconditionally:
      # out.json is republished on every run too (VRT_PUBLISH_PATTERN above
      # always matches it), so the marker never outlives the result it
      # points at. Runs after the PR comment step (not before) and
      # tolerates its own failure so a transient marker-write error can never
      # skip the comment or fail the job.
      - name: Publish VRT commit marker
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo -n "${{ github.sha }}" | aws s3 cp - "s3://tq-vrt/${{ steps.vrt-keys.outputs.actual_key }}/sha" \
            --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com

      # Reached only once reg-suit has successfully published this run's own
      # report, so a failure above never touches the shared baseline. Only
      # failed+new items are uploaded (actual/ holds nothing else — see the
      # Strip step above) and only deleted items are removed; every passed
      # item is already correct in baseline/actual/ and is left alone.
      # Requires has_diff == 'true': a zero-diff run has nothing to change.
      - name: Update VRT baseline
        if: github.ref == 'refs/heads/main' && steps.vrt-compare.outputs.has_diff == 'true'
        working-directory: web
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp .reg/actual s3://tq-vrt/baseline/actual \
            --recursive \
            --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com

          jq -r '.deletedItems[]' .reg/out.json | while IFS= read -r item; do
            aws s3 rm "s3://tq-vrt/baseline/actual/$item" \
              --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com
          done
