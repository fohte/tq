name: VRT comment on PR open

# test.yml only runs on push, so a PR opened after its head commit's push-side
# CI already finished never gets a VRT comment (that CI run found no open PR
# to comment on). This covers that gap by checking once, right when the PR
# opens, whether a VRT result is already published for the head commit.

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  vrt-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # If this 404s, the push-side CI for this head commit hasn't published a
      # result yet (or is still running) and will comment itself on
      # completion, so this must not wait for it and just exits here.
      - name: Fetch VRT result for this PR's head commit
        id: fetch
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=$(curl -sS -o out.json -w '%{http_code}' "https://tq-vrt.fohte.net/pr/${SHA}/out.json")
          if [ "$status" != "200" ]; then
            echo "No VRT result yet for $SHA (HTTP $status)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Post VRT PR comment
        if: steps.fetch.outputs.found == 'true'
        uses: ./.github/actions/vrt-comment
        with:
          repo: ${{ github.repository }}
          branch: ${{ github.event.pull_request.head.ref }}
          out-json-path: out.json
          report-url: https://tq-vrt.fohte.net/pr/${{ github.event.pull_request.head.sha }}/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}
