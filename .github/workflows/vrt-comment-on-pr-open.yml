name: VRT comment on PR open

# test.yml only runs on push, so a PR opened after its head commit's push-side
# CI already finished never gets a VRT comment (that CI run found no open PR
# to comment on). This covers that gap by checking once, right when the PR
# opens, whether a VRT result is already published for the head commit.

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  vrt-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # vrt.yml publishes to branch/<ref_name> (overwritten by every push to
      # that branch), not a per-commit key, so the "sha" marker it writes
      # alongside must be checked first to confirm the branch key still
      # reflects this PR's head commit and not an older, since-superseded
      # push. Anything short of an exact match (missing, still publishing, a
      # transient R2/network error, or a stale sha) is treated the same way:
      # the push-side CI for this head commit will comment itself once it
      # completes, so this must not wait for it and just exits here instead
      # of retrying.
      - name: Fetch VRT result for this PR's head commit
        id: fetch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha_status=$(curl -sS -o sha.txt -w '%{http_code}' "https://tq-vrt.fohte.net/branch/${BRANCH}/sha") || sha_status=000
          if [ "$sha_status" != "200" ] || [ "$(cat sha.txt)" != "$SHA" ]; then
            echo "No VRT result published for $SHA yet."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(curl -sS -o out.json -w '%{http_code}' "https://tq-vrt.fohte.net/branch/${BRANCH}/out.json") || status=000
          if [ "$status" != "200" ]; then
            echo "No VRT report published for $SHA (likely no visual diff)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Post VRT PR comment
        if: steps.fetch.outputs.found == 'true'
        uses: ./.github/actions/vrt-comment
        with:
          repo: ${{ github.repository }}
          branch: ${{ github.event.pull_request.head.ref }}
          sha: ${{ github.event.pull_request.head.sha }}
          out-json-path: out.json
          report-url: https://tq-vrt.fohte.net/branch/${{ github.event.pull_request.head.ref }}/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}
