name: Test

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    # tbls doc generation below needs a live DB to introspect.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tq
          POSTGRES_PASSWORD: tq
          POSTGRES_DB: tq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: fohte
          identity: ${{ github.event.repository.name }}
          domain: octo-sts.fohte.net

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if current commit is auto-format by bot
        id: check-auto-format
        run: |
          commit_message=$(git log -1 --format=%s)
          commit_author=$(git log -1 --format=%an)
          echo "Current commit message: $commit_message"
          echo "Current commit author: $commit_author"

          # Skip if the current commit is an auto-format commit by a bot
          # to prevent infinite loop: auto-format push -> CI -> auto-format push -> ...
          if [ "$commit_message" = "style: auto-format" ] && [[ "$commit_author" == *"[bot]"* ]]; then
            echo "skip_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.16

      # lefthook hooks (eslint, prettier, etc.) shell out to `pnpm`, so corepack
      # must activate before lefthook runs. corepack creates the pnpm executable
      # inside mise's node install bin directory; reshim so the mise shims dir
      # (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Apply DB migrations
        working-directory: api
        env:
          DATABASE_URL: postgresql://tq:tq@localhost:5432/tq_test
        run: pnpm run db:migrate

      - name: Generate DB documentation (ER diagram)
        env:
          DATABASE_URL: postgresql://tq:tq@localhost:5432/tq_test
        run: mise x tbls -- tbls doc --rm-dist

      # lefthook's `--all-files` resolves `{staged_files}` via `git ls-files --cached`,
      # which skips untracked files. Stage newly generated docs so a schema-adding PR's
      # first CI run formats them here instead of leaving a follow-up commit on main.
      - name: Stage generated DB documentation
        run: git add docs/db

      - name: Run lefthook
        id: lefthook
        continue-on-error: true
        env:
          # pinact's min-age check calls the GitHub API; without a token it hits
          # the 60 req/h unauthenticated limit shared per IP and fails on CI.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lefthook run pre-commit --all-files

      # Formatters configured with `stage_fixed: true` run `git add` after formatting,
      # which stages the changes.
      # commit-action uses `git ls-files --modified` which only detects unstaged changes.
      # https://github.com/suzuki-shunsuke/commit-action/blob/87b297f0ce551411b43d1880f4fb3cbc60381055/action.yaml#L57
      # We need to unstage the changes so commit-action can detect them.
      - name: Unstage changes for commit-action
        run: git restore --staged .

      - name: Commit formatted files
        if: ${{ !cancelled() && steps.check-auto-format.outputs.skip_commit != 'true' }}
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          commit_message: 'style: auto-format'
          workflow: deny
          github_token: ${{ steps.octo-sts.outputs.token }}

      - name: Fail if lefthook failed
        if: steps.lefthook.outcome == 'failure'
        run: exit 1

  # Build the unit-test matrix at runtime: branch protection pins the fixed-name
  # `unit-test` gate below, so the per-package legs are enumerated here instead.
  setup:
    runs-on: ubuntu-slim
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed
        with:
          json: true
          # Emit valid JSON; the default escapes quotes and breaks jq parsing.
          escape_json: false
          # The default sanitizes filenames by backslash-escaping shell
          # metacharacters (e.g. `$` in TanStack Router's `$param.tsx` files),
          # which also breaks JSON parsing. CHANGED_FILES below is always
          # consumed through a quoted env var and jq, never eval'd, so
          # disabling this is safe here.
          safe_output: false

      - name: Build package matrix
        id: set-packages
        env:
          # Changes to these files affect every package, so they trigger the full matrix.
          GLOBAL_PATHS_REGEX: '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/test\.yml)$'
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          # Workspace packages are the directories holding a non-root package.json.
          mapfile -t pkgs < <(git ls-files '*/package.json' | grep -v node_modules | sed 's#/package.json$##' | sort -u)

          if echo "$CHANGED_FILES" | jq -r '.[]' | grep -qE "$GLOBAL_PATHS_REGEX"; then
            selected=("${pkgs[@]}")
          else
            selected=()
            for dir in "${pkgs[@]}"; do
              if echo "$CHANGED_FILES" | jq -e --arg d "${dir}/" 'any(.[]; startswith($d))' >/dev/null; then
                selected+=("$dir")
              fi
            done
          fi

          if [ ${#selected[@]} -eq 0 ]; then
            packages='[]'
          else
            packages=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $packages"

  unit-test-run:
    needs: setup
    if: ${{ needs.setup.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.setup.outputs.packages) }}
    name: 'unit-test (${{ matrix.package }})'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.16

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # Install the full workspace: `web`'s `tsc --noEmit` reads `api`'s source for
      # cross-package types, so a `--filter ./web...` install leaves it unable to
      # resolve `api`'s `node_modules` and the type-check step fails.
      - run: pnpm install --frozen-lockfile

      # `web`'s `test:storybook` runs Storybook stories through a headless
      # Playwright chromium browser, which isn't preinstalled on the runner.
      # The browser binary is cached, but OS-level packages installed by
      # `--with-deps` aren't (they don't live under this cache path), so a
      # cache hit still needs `install-deps` to cover them.
      - name: Cache Playwright browsers
        if: matrix.package == 'web'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: matrix.package == 'web' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: matrix.package == 'web' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      # Only the `api` package's integration tests need PostgreSQL.
      - name: Start PostgreSQL
        if: matrix.package == 'api'
        uses: ./.github/actions/start-postgres

      - name: Run tests
        working-directory: ${{ matrix.package }}
        env:
          # The api leg's integration tests need this; harmless no-op for other legs.
          DATABASE_URL: postgresql://tq:tq@localhost:5432/tq_test
        run: pnpm run test

      - name: Get GitHub token for VRT PR comment
        if: matrix.package == 'web'
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts-vrt
        with:
          scope: fohte
          identity: ${{ github.event.repository.name }}
          domain: octo-sts.fohte.net

      # main pushes publish under the pr/ prefix too (as pr/main-<sha>) so the
      # new snapshot never overwrites main/latest directly — if reg-suit or
      # the promote step below fails, main/latest (the baseline every PR
      # compares against) is untouched instead of ending up deleted or half
      # written. The pr/ prefix's 3-day lifecycle rule cleans these up same
      # as regular PR snapshots.
      - name: Set VRT snapshot keys
        if: matrix.package == 'web'
        id: vrt-keys
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "actual_key=pr/main-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "actual_key=pr/${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "expected_key=main/latest" >> "$GITHUB_OUTPUT"

      - name: Run VRT (reg-suit)
        if: matrix.package == 'web'
        working-directory: web
        env:
          VRT_ACTUAL_KEY: ${{ steps.vrt-keys.outputs.actual_key }}
          VRT_EXPECTED_KEY: ${{ steps.vrt-keys.outputs.expected_key }}
          VRT_GITHUB_TOKEN: ${{ steps.octo-sts-vrt.outputs.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: pnpm exec reg-suit run

      # Only reached once reg-suit has successfully published the new actual
      # images under pr/main-<sha>, so a failure above never touches
      # main/latest. `sync --delete` also drops images for removed stories,
      # which a plain overwrite would otherwise leave behind forever.
      # Concurrent main pushes aren't serialized here — main is merged
      # serially by a single maintainer in practice, and an overlapping race
      # self-corrects on the next push.
      - name: Promote VRT snapshot to main/latest
        if: matrix.package == 'web' && github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync "s3://tq-vrt/${{ steps.vrt-keys.outputs.actual_key }}/actual" s3://tq-vrt/main/latest/actual \
            --delete \
            --endpoint-url https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com

  # Aggregation gate for the unit-test matrix. Matrix leg names are dynamic and
  # cannot be pinned as a required status check, so this single fixed-name job is
  # the branch protection gate instead. It fails only when a needed job failed;
  # when every leg succeeds (or the matrix is skipped because nothing changed) it
  # is skipped, and a skipped required check counts as success.
  unit-test:
    runs-on: ubuntu-slim
    needs:
      - setup
      - unit-test-run
    if: failure()
    steps:
      - run: exit 1
