name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Build the unit-test matrix at runtime: branch protection pins the fixed-name
  # `unit-test` gate below, so the per-package legs are enumerated here instead.
  setup:
    runs-on: ubuntu-slim
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tj-actions/changed-files needs the previous commit for `push`
          # events (used for the push-to-main leg below); `pull_request`
          # events diff against the PR base regardless of depth.
          fetch-depth: 2

      - name: Detect changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed
        with:
          json: true
          # Emit valid JSON; the default escapes quotes and breaks jq parsing.
          escape_json: false
          # The default sanitizes filenames by backslash-escaping shell
          # metacharacters (e.g. `$` in TanStack Router's `$param.tsx` files),
          # which also breaks JSON parsing. CHANGED_FILES below is always
          # consumed through a quoted env var and jq, never eval'd, so
          # disabling this is safe here.
          safe_output: false

      - name: Build package matrix
        id: set-packages
        env:
          # Changes to these files affect every package, so they trigger the full matrix.
          GLOBAL_PATHS_REGEX: '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/test\.yml|\.github/workflows/vrt\.yml|\.github/actions/setup-workspace/action\.yml)$'
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          # Workspace packages are the directories holding a non-root package.json.
          mapfile -t pkgs < <(git ls-files '*/package.json' | grep -v node_modules | sed 's#/package.json$##' | sort -u)

          if echo "$CHANGED_FILES" | jq -r '.[]' | grep -qE "$GLOBAL_PATHS_REGEX"; then
            selected=("${pkgs[@]}")
          else
            selected=()
            for dir in "${pkgs[@]}"; do
              if echo "$CHANGED_FILES" | jq -e --arg d "${dir}/" 'any(.[]; startswith($d))' >/dev/null; then
                selected+=("$dir")
              fi
            done
          fi

          if [ ${#selected[@]} -eq 0 ]; then
            packages='[]'
          else
            packages=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $packages"

  unit-test-run:
    needs: setup
    if: ${{ needs.setup.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.setup.outputs.packages) }}
    name: 'unit-test (${{ matrix.package }})'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-workspace

      # Only the `api` package's integration tests need PostgreSQL.
      - name: Start PostgreSQL
        if: matrix.package == 'api'
        uses: ./.github/actions/start-postgres

      - name: Run tests
        working-directory: ${{ matrix.package }}
        env:
          # The api leg's integration tests need this; harmless no-op for other legs.
          DATABASE_URL: postgresql://tq:tq@localhost:5432/tq_test
        run: pnpm run test

  # Storybook's screenshot capture and reg-suit's comparison/publish live in
  # their own reusable workflow so they can shard across runners instead of
  # sharing the `web` leg above with the (browser-free) type-check and unit
  # test run.
  vrt:
    # Doesn't need unit-test-run: a red web `tsc --noEmit`/unit-test leg
    # doesn't affect whether stories render correctly, and an incomplete
    # screenshot set (the actual risk to the baseline) already fails
    # vrt.yml's shard job, which blocks its report job (needs: shard) from
    # promoting anything.
    needs: setup
    if: ${{ contains(fromJSON(needs.setup.outputs.packages), 'web') }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/vrt.yml
    with:
      branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      is-main: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # Aggregation gate for unit-test-run's matrix and the vrt reusable workflow
  # call. Matrix leg names are dynamic and cannot be pinned as a required
  # status check, so this single fixed-name job is the branch protection gate
  # instead. It fails only when a needed job failed; when every leg succeeds
  # (or a job is skipped because nothing changed) it is skipped, and a
  # skipped required check counts as success.
  unit-test:
    runs-on: ubuntu-slim
    needs:
      - setup
      - unit-test-run
      - vrt
    if: failure()
    steps:
      - run: exit 1
