  # Build the unit-test matrix at runtime: branch protection pins the fixed-name
  # `unit-test` gate below, so the per-package legs are enumerated here instead.
  setup:
    runs-on: ubuntu-slim
    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
      test_packages: ${{ steps.set-packages.outputs.test_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request events diff against the PR base regardless of
          # depth. push events (this workflow only pushes on main — see
          # `on.push.branches` above) diff against the previous commit, plus
          # one more commit of history for the auto-format grandparent-diff
          # below.
          fetch-depth: ${{ github.event_name == 'push' && 3 || 2 }}

      - uses: ./.github/actions/detect-auto-format-commit
        id: detect-auto-format
        if: github.event_name == 'push'

      # An auto-format commit pushed straight to main by format.yml has its
      # own diff be just the formatter's output (e.g. regenerated docs/db),
      # not the human change that triggered it. Diffing against its
      # grandparent instead unions both, so package detection below (and
      # thus vrt/unit-test-run) doesn't miss a change that already ran once
      # in the triggering push. Not needed on pull_request: base-to-head
      # diffing there is already cumulative, and an auto-format commit
      # pushed after a PR is open retriggers pull_request:synchronize.
      - name: Find changed-files base SHA
        id: base-sha
        if: steps.detect-auto-format.outputs.is_auto_format == 'true'
        run: |
          base_sha=$(git rev-parse HEAD~2)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Detect changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed
        with:
          base_sha: ${{ steps.base-sha.outputs.base_sha }}
          json: true
          # Emit valid JSON; the default escapes quotes and breaks jq parsing.
          escape_json: false
          # The default sanitizes filenames by backslash-escaping shell
          # metacharacters (e.g. `$` in TanStack Router's `$param.tsx` files),
          # which also breaks JSON parsing. CHANGED_FILES below is always
          # consumed through a quoted env var and jq, never eval'd, so
          # disabling this is safe here.
          safe_output: false

      - name: Build package matrix
        id: set-packages
        env:
          # Changes to these files affect every package, so they trigger the full matrix.
          GLOBAL_PATHS_REGEX: '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/test\.yml|\.github/workflows/vrt\.yml|\.github/actions/setup-workspace/action\.yml)$'
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          # Workspace packages are the directories holding a non-root package.json.
          mapfile -t pkgs < <(git ls-files '*/package.json' | grep -v node_modules | sed 's#/package.json$##' | sort -u)

          if echo "$CHANGED_FILES" | jq -r '.[]' | grep -qE "$GLOBAL_PATHS_REGEX"; then
            selected=("${pkgs[@]}")
          else
            selected=()
            for dir in "${pkgs[@]}"; do
              if echo "$CHANGED_FILES" | jq -e --arg d "${dir}/" 'any(.[]; startswith($d))' >/dev/null; then
                selected+=("$dir")
              fi
            done
          fi

          if [ ${#selected[@]} -eq 0 ]; then
            packages='[]'
          else
            packages=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $packages"

          # Directory name and package.json `name` diverging is not
          # guaranteed, so resolve workspace:-protocol dependency names
          # through each package's own `name` field instead of assuming it
          # equals the directory.
          pkg_info=$(for dir in "${pkgs[@]}"; do
            jq -c --arg dir "$dir" '{dir: $dir, name, deps: [((.dependencies // {}) + (.devDependencies // {})) | to_entries[] | select(.value | startswith("workspace:")) | .key]}' "$dir/package.json"
          done | jq -sc .)

          # Also test packages that import a changed package's code (e.g.
          # cli/web import api directly), so a breaking change there fails
          # its own PR.
          test_packages=$(jq -nc --argjson pkg_info "$pkg_info" --argjson selected "$packages" '
            ($pkg_info | map({(.name): .dir}) | add) as $dir_of_name
            | ($pkg_info | map({(.dir): (.deps | map($dir_of_name[.]))}) | add) as $graph
            | def closure(sel):
                ($graph | to_entries | map(select(.value | any(. as $d | sel | index($d) != null)) | .key)) as $newly
                | (sel + $newly | unique) as $next
                | if ($next | length) == (sel | length) then $next else closure($next) end;
              closure($selected)
          ')
          echo "test_packages=$test_packages" >> "$GITHUB_OUTPUT"
          echo "Selected test packages: $test_packages"

