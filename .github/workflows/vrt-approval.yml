name: VRT approval

# vrt.yml sets the `vrt` commit status per push based on reg-suit's diff
# result. This workflow lets a human override that to success for an
# intentional diff via the `vrt-approved` label, and keeps the label from
# silently surviving a diff nobody has actually reviewed.

on:
  pull_request:
    types: [synchronize, labeled]

jobs:
  vrt-approval:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: fohte/storybook-vrt-workflows/.github/workflows/vrt-approval.yml@90d01ee2e4d8501cce03b6cb938bb08d5e011edc # v0.1.4
    with:
      r2-bucket: tq-vrt
