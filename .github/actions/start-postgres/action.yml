name: Start PostgreSQL
description: >-
  Start PostgreSQL and export the API dev/test database URLs for subsequent steps.

runs:
  using: composite
  steps:
    - name: Start PostgreSQL container
      shell: bash
      run: |
        mise run db:up
        {
          echo "DATABASE_URL=$(scripts/db-url api dev)"
          echo "TEST_DATABASE_URL=$(scripts/db-url api test)"
        } >> "$GITHUB_ENV"
