name: Start PostgreSQL
description: >-
  Start the docker-compose.yml PostgreSQL container for integration tests,
  create the tq_test database, and export TEST_DATABASE_URL for subsequent
  steps.

runs:
  using: composite
  steps:
    - name: Start PostgreSQL container
      shell: bash
      run: |
        mise run db:up
        docker compose exec db createdb -U tq tq_test
        grep -v '^#' .env.runtime >> "$GITHUB_ENV"
