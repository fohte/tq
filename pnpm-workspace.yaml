packages:
  - 'web'
  - 'api'
  - 'cli'

allowBuilds:
  # required by vitest's transformer
  esbuild: true
  # required by @opentelemetry/exporter-trace-otlp-proto
  protobufjs: true
  # required by @fohte/eslint-config -> eslint-plugin-import-x for module resolution
  unrs-resolver: true
  # required by cloudflare/wrangler-action's internal `pnpm add wrangler` step (Storybook deploy)
  workerd: true
  # runs `msw init`, regenerating web/public/mockServiceWorker.js from the
  # installed msw version — web/package.json sets "msw.workerDirectory".
  # Reads the package.json at $INIT_CWD, so this only fires on a `pnpm
  # install` run from web/, not from the workspace root.
  msw: true

# Dodge short-lived supply-chain attacks (e.g. shai-hulud, tinycolor) by
# holding off freshly published versions. Unit is minutes; 10080 = 7 days.
minimumReleaseAge: 10080
# First-party scopes: publisher account is trusted, so skip the release-age delay.
minimumReleaseAgeExclude:
  - '@fohte/*'
  # Renovate security update: vite@7.3.5
  - vite@7.3.5
  # Renovate security update: hono@4.12.25 || 4.12.27 || 4.12.34
  - hono@4.12.25 || 4.12.27 || 4.12.34
  # Renovate security update: @hono/node-server@1.19.15
  - '@hono/node-server@1.19.15'
