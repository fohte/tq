name: tq api
docPath: docs/db
disableOutputSchema: true
er:
  format: mermaid
exclude:
  - drizzle.*
lint:
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
    exclude: [id, created_at, updated_at]
comments:
  - table: agent_sessions
    tableComment: 'Sessions reported by coding agent providers.'
    columnComments:
      provider: 'Coding agent provider: claude_code or codex.'
      session_id: 'Session identifier assigned by the provider.'
      parent_session_id: 'Raw parent session ID reported by the provider; it may be recorded before the parent session.'
      context: 'Whether the session belongs to the work or personal context.'
      cwd: 'Working directory associated with the session.'
      label: 'Session label reported by the provider integration.'
      last_message: 'Most recent message extracted from the session transcript.'
      custom_label: 'Human-assigned session name that is kept separately from the reported label.'
      started_at: 'Time when the session was first recorded.'
      last_active_at: 'Time of the most recent activity report for the session.'
      ended_at: 'Time the integration last reported the session as ended; cleared by a later activity report.'
      archived_at: 'Time the session was archived by an external session manager.'
  - table: assets
    tableComment: 'Metadata for uploaded assets stored in object storage.'
    columnComments:
      r2_key: 'Unique object key used to locate the asset in R2 storage.'
      content_type: 'Media type of the asset.'
      size_bytes: 'Asset size in bytes.'
  - table: calendar_subscriptions
    tableComment: 'Calendars selected for OAuth accounts.'
    columnComments:
      oauth_token_id: 'OAuth credentials associated with this calendar.'
      calendar_id: 'Provider identifier for the selected calendar.'
      display_name: 'Cached display name of the calendar.'
      color: 'Cached calendar color value.'
      context: 'Context where events show full details; they appear as busy time in the other context. Null shows full details everywhere.'
  - table: edits
    tableComment: 'Records for task, page, or comment creation and field updates.'
    columnComments:
      task_id: 'Task associated with the edited record.'
      page_id: 'Edited page, when the edit targets a page.'
      comment_id: 'Edited comment, when the edit targets a comment.'
      action: 'Edit operation: create or update.'
      field: 'Updated field: title, description, or content; valid values depend on the edited record type. Null for create actions.'
      author_kind: 'Author category: human, llm, or system.'
      author_agent: 'Agent identifier for llm-authored edits; null for other author categories.'
  - table: github_sync_rule_ignored_issues
    tableComment: 'GitHub issues excluded by a synchronization rule.'
    columnComments:
      rule_id: 'Synchronization rule associated with this issue.'
      owner: 'Owner of the repository containing this issue.'
      repo: 'Repository containing this issue.'
      number: 'GitHub issue number.'
  - table: github_sync_rules
    tableComment: 'GitHub synchronization rules associated with a target project.'
    columnComments:
      scope: 'Repositories covered by the rule: all, org, or repo.'
      org: 'Organization covered by the rule when scope is org or repo.'
      repo: 'Repository covered by the rule when scope is repo.'
      trigger: 'Synchronization trigger value: assigned.'
      target_project_id: 'Project associated with the rule.'
      enabled: 'Whether the rule is enabled.'
      seed_ignore_on_next_sync: 'Whether the first synchronization seeds matching existing issues as ignored instead of creating tasks for them.'
      seq: 'Insertion-order sequence used to break ties between rules created at the same time.'
  - table: labels
    tableComment: 'Reusable labels that can be assigned to tasks and recurring task templates.'
    columnComments:
      name: 'Unique label name.'
      color: 'Optional color value associated with the label.'
      context: 'Whether the label belongs to the work or personal context.'
  - table: oauth_tokens
    tableComment: 'OAuth credentials identified by provider and account.'
    columnComments:
      provider: 'Integration provider associated with these credentials.'
      account_id: 'Stable provider-specific account identifier; GitHub uses an empty string because it is single-account.'
      account_label: 'Human-readable label for the provider account, when available.'
      access_token: 'Credential sent to the provider when making authenticated API requests.'
      refresh_token: 'OAuth refresh token; null for providers whose access tokens do not expire.'
      expires_at: 'Access token expiration time; null when the provider supplies no expiration.'
  - table: memos
    tableComment: 'Markdown scratchpads stored once per work or personal context.'
    columnComments:
      context: 'Context that owns the memo: work or personal.'
      content: 'Markdown document stored for the context.'
      revision: 'Monotonically increasing revision used to reject stale writes.'
      updated_at: 'Time when the memo content was last updated.'
  - table: projects
    tableComment: 'Projects group related tasks and track planning status and dates.'
    columnComments:
      title: 'Human-readable project title.'
      description: 'Optional description of the project.'
      status: 'Project lifecycle status: active, paused, completed, or archived.'
      start_date: 'Planned start date for the project.'
      target_date: 'Target completion date for the project.'
      color: 'Optional color value associated with the project.'
      sort_order: 'Position used to order projects.'
      context: 'Whether the project belongs to the work or personal context.'
  - table: push_subscriptions
    tableComment: 'Browser push endpoints and encryption credentials registered for notifications.'
    columnComments:
      endpoint: 'Push service URL identifying the browser subscription.'
      p256dh: 'Public key used to encrypt notification payloads for this endpoint.'
      auth: 'Authentication secret used with this push endpoint.'
      label: "Device name derived from the browser's User-Agent."
      context: 'Work or personal context targeted by notifications for this device.'
      last_success_at: 'Time of the most recent successful notification delivery; null before the first success.'
  - table: recurrence_rules
    tableComment: 'Recurrence definitions referenced by tasks, schedules, and recurring task templates.'
    columnComments:
      type: 'Recurrence unit or pattern: daily, weekly, monthly, or custom.'
      interval: 'Number of recurrence units between occurrences.'
      days_of_week: 'Days selected for weekly recurrence, using 0 for Sunday through 6 for Saturday.'
      day_of_month: 'Calendar day selected for monthly recurrence, from 1 through 31.'
  - table: recurring_task_template_labels
    tableComment: 'Join table associating recurring task templates with labels.'
    columnComments:
      template_id: 'Recurring task template receiving the label.'
      label_id: 'Label assigned to the recurring task template.'
  - table: recurring_task_templates
    tableComment: 'Definitions used by the scheduler to create recurring task instances.'
    columnComments:
      title: 'Title copied to each generated task.'
      description: 'Optional task details copied to generated tasks.'
      estimated_minutes: 'Estimated effort for each generated task, in minutes.'
      project_id: 'Project associated with generated tasks.'
      parent_id: 'Task under which each generated task is nested.'
      context: 'Whether generated tasks belong to the work or personal context.'
      recurrence_rule_id: 'Recurrence rule used to determine occurrence dates; each rule belongs to one template.'
      start_offset_days: "Days before the due date to set a generated task's start date; null leaves the start date unset."
      anchor_date: 'Base date used to calculate the first occurrence.'
      last_generated_date: 'Date of the most recent occurrence generated by the scheduler.'
      enabled: 'Whether the scheduler may generate future occurrences from this template.'
  - table: saved_views
    tableComment: 'Saved task searches with a display name, query, context, and position.'
    columnComments:
      name: 'Human-readable name of the saved view.'
      query: 'Raw search DSL query used by the saved view.'
      position: 'Position used to order saved views.'
      context: 'Whether the saved view belongs to the work or personal context.'
  - table: task_description_templates
    tableComment: 'Templates for structuring task descriptions.'
    columnComments:
      name: 'Unique name used to look up a description template.'
      when_to_use: 'Type of work for which the template should be selected.'
      body: 'Markdown skeleton intended for a task description.'
      guide: 'Writing instructions for completing each section of the body.'
      is_default: 'Whether the template is selected by default; at most one template may be default.'
  - table: task_checklists
    tableComment: 'Named or unnamed checklists associated with tasks.'
    columnComments:
      task_id: 'Task that owns this checklist.'
      name: 'Optional display name for the checklist.'
      sort_order: 'Position used to order the task checklists.'
  - table: task_checklist_items
    tableComment: 'Nested checklist items with completion state and optional Markdown detail.'
    columnComments:
      checklist_id: 'Checklist that owns this item.'
      parent_item_id: 'Parent item in the same checklist; null for a root item.'
      content: 'Single-line item text.'
      note: 'Optional Markdown detail for the item.'
      checked_at: 'Time when the item was checked; null while unchecked.'
      sort_order: 'Position among items with the same parent.'
      github_link_id: 'Optional GitHub issue or pull request linked to this item.'
      subtask_id: 'Optional task linked to this item as a subtask.'
  - table: schedules
    tableComment: 'Recurring calendar schedules with a local time range and optional recurrence rule.'
    columnComments:
      title: 'Human-readable schedule title.'
      start_time: 'Local start time of the schedule in 24-hour HH:MM format.'
      end_time: 'Local end time of the schedule in 24-hour HH:MM format.'
      recurrence_rule_id: 'Recurrence rule associated with the schedule; null for a one-time schedule.'
      context: 'Whether the schedule belongs to the work or personal context.'
      color: 'Optional color value associated with the schedule.'
  - table: schedule_overrides
    tableComment: 'One-day time changes and skipped schedule occurrences.'
    columnComments:
      schedule_id: 'Schedule whose occurrence is changed.'
      occurrence_date: 'Date on which the changed occurrence starts.'
      start_time: 'Replacement local start time in 24-hour HH:MM format; null when skipped.'
      end_time: 'Replacement local end time in 24-hour HH:MM format; null when skipped.'
      skipped: 'Whether the occurrence is omitted for this date.'
  - table: scheduling_settings
    tableComment: 'Singleton preferences for task scheduling.'
    columnComments:
      working_hours_start: 'Start of the working-hours window in local 24-hour HH:MM format.'
      working_hours_end: 'End of the working-hours window in local 24-hour HH:MM format.'
      minimum_block_minutes: 'Minimum scheduling block length, in minutes.'
      auto_reschedule_on_gcal_change: 'Whether task blocks are automatically rescheduled when Google Calendar changes.'
  - table: task_agent_sessions
    tableComment: 'Associations between tasks and coding agent sessions.'
    columnComments:
      task_id: 'Task associated with the agent session.'
      agent_session_id: 'Agent session associated with the task.'
      linked_at: 'Time when the task was linked to the agent session; existing links receive the migration time.'
  - table: task_comments
    tableComment: 'Text comments attached to tasks.'
    columnComments:
      task_id: 'Task that owns this comment.'
      content: 'User-authored body of the task comment.'
  - table: task_events
    tableComment: 'Task status changes and GitHub link or unlink events shown in the activity timeline.'
    columnComments:
      task_id: 'Task associated with this event.'
      type: 'Event category: status_changed, github_linked, or github_unlinked.'
      from_status: 'Previous status for a status_changed event: todo, in_progress, or completed.'
      to_status: 'New status for a status_changed event: todo, in_progress, or completed.'
      to_status_reason: 'Reason recorded for a transition to completed: completed, not_planned, or duplicate.'
      github_owner: 'Owner of the linked GitHub repository.'
      github_repo: 'Name of the linked GitHub repository.'
      github_number: 'Number of the linked GitHub issue or pull request.'
      github_kind: 'Linked GitHub item type: issue or pull_request.'
      author_kind: 'Author category: human, llm, or system.'
      author_agent: 'Agent identifier for llm-authored events; null for other author categories.'
  - table: task_github_links
    tableComment: 'GitHub issues and pull requests linked to tasks.'
    columnComments:
      task_id: 'Task linked to this GitHub item.'
      owner: 'Owner of the repository containing this item.'
      repo: 'Repository containing this item.'
      number: 'GitHub issue or pull request number.'
      role: 'Whether this item is the task subject or a GitHub blocker.'
      notify_events: 'GitHub change events selected for notifications: closed, reopened, comments, or other.'
      kind: 'GitHub item type: issue or pull_request.'
      url: 'URL of the linked GitHub item.'
      state: 'Cached item state: open, closed, or merged.'
      title: 'Cached title of the linked GitHub item.'
      comments_count: 'Cached number of comments on the linked GitHub item.'
      github_updated_at: 'GitHub updated_at timestamp observed during the latest fetch.'
      state_reason: 'Cached GitHub reason for closing or reopening the item.'
      etag: 'ETag from the latest GitHub response, used for conditional synchronization.'
      last_synced_at: "Time when the linked item's cached GitHub state was last synchronized."
      seq: 'Insertion-order sequence used to break ties between links created at the same time.'
  - table: task_labels
    tableComment: 'Join table associating tasks with labels.'
    columnComments:
      task_id: 'Task receiving the label.'
      label_id: 'Label assigned to the task.'
  - table: task_links
    tableComment: 'Directed task links derived from task descriptions, page content, and comments.'
    columnComments:
      source_task_id: "Task whose content mentions the target task's human-facing number."
      target_task_id: "Task referenced by the number in the source task's content."
  - table: task_pages
    tableComment: 'Formatted content pages attached to tasks.'
    columnComments:
      task_id: 'Task that owns this page.'
      title: 'Title shown for this task page.'
      content: 'Page body stored according to format; defaults to an empty string.'
      format: 'Content format: markdown or html. Defaults to markdown.'
      sort_order: 'Ordering value for pages belonging to the same task.'
  - table: task_queue_items
    tableComment: 'Tasks placed in a queue, optionally for a specific period.'
    columnComments:
      queue_id: 'Queue containing the task.'
      period_start: 'Period start date: the date for a daily queue, Monday for a weekly queue, or the first of the month; null for a static queue.'
      task_id: 'Task placed in the queue.'
      sort_order: 'Position of the task within the queue period.'
  - table: task_queues
    tableComment: 'Named queues that organize tasks, with optional period-based rollover.'
    columnComments:
      key: 'Stable programmatic identifier, separate from the display name.'
      name: 'Human-readable queue name.'
      period_unit: 'Rollover period: day, week, or month; null for a static queue.'
      position: 'Position used to order queues.'
  - table: task_relations
    tableComment: 'User-defined directed relationships between tasks.'
    columnComments:
      source_task_id: 'Task whose relationship is described; read the relation from source to target.'
      target_task_id: 'Task at the target end of the directed relationship.'
      type: 'Relation read as source type target: duplicate_of or blocked_by.'
  - table: task_waits
    tableComment: 'Response waits attached to tasks, including their resolution history.'
    columnComments:
      task_id: 'Task waiting for a response.'
      body: 'Markdown describing the response or action the task is waiting for.'
      follow_up_date: 'Date to follow up when no response has arrived.'
      resolved_at: 'Time when the response wait was resolved; null while it blocks the task.'
      acknowledged_at: 'Time when the resolution was acknowledged by the user.'
  - table: tasks
    tableComment: 'Tasks with optional parent, project, recurrence, and template relationships.'
    columnComments:
      number: 'Globally unique, human-facing sequential task number.'
      title: 'Human-readable task title.'
      description: 'Optional task details.'
      description_template_id: 'Description template that validated an LLM-authored task; null if no template was used, the task was human-authored, or the template was deleted.'
      status: 'Task status: todo or completed.'
      status_reason: 'Reason for the completed status: completed, not_planned, or duplicate.'
      start_date: 'Date when work on the task is planned to start.'
      due_date: 'Task deadline date.'
      estimated_minutes: 'Estimated task effort, in minutes.'
      parent_id: 'Parent task in the task hierarchy.'
      project_id: 'Project associated with the task.'
      recurrence_rule_id: 'Recurrence rule associated with the task.'
      template_id: 'Recurring task template that generated this task; null for tasks created independently.'
      occurrence_date: 'Date represented by this generated task occurrence; set together with template_id.'
      context: 'Whether the task belongs to the work or personal context.'
      commitment: 'Triage state: inbox for untriaged, active for committed, or someday for deferred.'
      remind_at: 'Time when a reminder is due; cleared when claimed for delivery.'
  - table: time_blocks
    tableComment: 'Scheduled time intervals assigned to tasks.'
    columnComments:
      task_id: 'Task assigned to this time block.'
      start_time: 'Start instant of the scheduled time interval.'
      end_time: 'End instant of the scheduled time interval.'
      is_auto_scheduled: 'Whether the time block was created by automatic scheduling.'
